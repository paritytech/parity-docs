name: Vale style check

on:
  pull_request:
    paths:
      - "**.md"
      - ".vale.ini"
      - "styles/StyleGuide/**"
      - "styles/Parity/**"
      - ".github/scripts/check_operator_language.py"
      - "styles/config/vocabularies/**"
      - ".github/scripts/sync-styleguide-vale.sh"
      - ".github/workflows/vale.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Vale rules are vendored in styles/StyleGuide/ (committed) — no sync needed.

      - name: List changed markdown files
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only --diff-filter=AM "$base...$head" -- '*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed markdown files: $files"

      - name: Run Vale on changed files
        if: steps.changed.outputs.files != ''
        uses: errata-ai/vale-action@reviewdog
        with:
          files: ${{ steps.changed.outputs.files }}
          # The list is space-separated; without a separator the action treats
          # it as one path, finds no such file, and lints the whole repo.
          separator: " "
          # Advisory only: surface findings as annotations on the PR diff and
          # in the job summary, without blocking merge. github-pr-annotations
          # prints GitHub Actions workflow commands instead of calling the
          # Checks API, so it needs no checks: write permission and also works
          # for pull requests from forks, where GITHUB_TOKEN is read-only.
          fail_on_error: false
          reporter: github-pr-annotations
          filter_mode: added
          token: ${{ secrets.GITHUB_TOKEN }}

  # Blocking check: Parity is an author, not an operator. Fails only on lines
  # this PR adds, so existing wording does not block unrelated changes. Uses
  # the patterns in styles/Parity/OperatorLanguage.yml, but also checks text
  # Vale skips (admonitions, content tabs, snippets).
  operator-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check added lines for operator language
        run: |
          python -m pip install --quiet pyyaml
          python .github/scripts/check_operator_language.py --diff \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

