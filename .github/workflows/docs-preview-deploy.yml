# PR previews, step 2 of 2: deploy the built site to Cloudflare Pages and
# comment the preview link on the pull request.
#
# Runs on `workflow_run` in the base repository's context, so it can use the
# Cloudflare secrets even for pull requests from forks. It never checks out or
# runs code from the pull request: it only deploys the static files that
# `docs-preview-build.yml` built.
#
# Setup (once):
#   - Repo secrets: CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit"),
#     CLOUDFLARE_ACCOUNT_ID. The Pages project (default name: parity-docs) is
#     created automatically on the first run.
#   - Optional repo variable CLOUDFLARE_PAGES_PROJECT to use a different name.

name: Docs Preview Deploy

on:
  workflow_run:
    workflows: ["Docs Preview Build"]
    types: [completed]

permissions:
  actions: read          # download the artifact from the build run
  contents: read
  pull-requests: write   # comment the preview link

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-preview-deploy-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_repository.full_name }}
      cancel-in-progress: true
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'parity-docs' }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-preview
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The PR number comes from an artifact built from untrusted PR code, so
      # accept nothing but digits before using it anywhere.
      - name: Read and validate the PR number
        id: pr
        run: |
          number="$(tr -d '[:space:]' < site/.pr-number)"
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number in artifact"
            exit 1
          fi
          rm site/.pr-number
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the preview deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Creates the Pages project on first use, so no dashboard setup is needed.
      # On later runs the project already exists and this step fails harmlessly.
      - name: Create the Cloudflare Pages project if it does not exist
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PROJECT }} --branch=pr-${{ steps.pr.outputs.number }} --commit-hash=${{ github.event.workflow_run.head_sha }} --commit-dirty=true

      - name: Comment the preview link
        if: steps.creds.outputs.ok == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.pr.outputs.number }}
          header: docs-preview
          message: |
            **Docs preview** for ${{ github.event.workflow_run.head_sha }}

            ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}

            This link updates on every push to the pull request.
