# PR previews, step 1 of 2: build the site for a pull request.
#
# Runs on `pull_request` with read-only permissions and no secrets, so it is
# safe for pull requests from forks. It uploads the built site plus the PR
# number as an artifact; `docs-preview-deploy.yml` picks it up and deploys it.

name: Docs Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "material-overrides/**"
      - "hooks/**"
      - "layouts/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "llms_config.json"
      - "redirects.json"
      - "requirements.txt"
      - ".github/workflows/docs-preview-build.yml"

permissions:
  contents: read

concurrency:
  group: docs-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history for git-revision-date-localized under --strict
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Same build as production (deploy-pages.yml), minus social cards, which
      # are slow to generate and not needed to review content.
      - name: Build site
        env:
          SOCIAL_CARDS: "false"
        run: mkdocs build --strict -d site

      - name: Generate client-side redirect stubs
        run: python scripts/gen_redirects.py --site-dir site --redirects redirects.json

      - name: Record the PR number for the deploy workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > site/.pr-number

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: site
          include-hidden-files: true
          retention-days: 3
