# Variables that can be reused should be added to this file
dependencies:
  repositories:
    zombienet:
      repository_url: https://github.com/paritytech/zombienet
      version: v1.3.140
      architecture: macos-arm64
    polkadot_sdk:
      repository_url: https://github.com/paritytech/polkadot-sdk
      version: polkadot-stable2609-2
      docker_image_version: stable2609-2
    dotns:
      repository_url: https://github.com/paritytech/dotns
      version: v1.1.0
    try_runtime_cli:
      repository_url: https://github.com/paritytech/try-runtime-cli
      version: v0.10.1
    polkadot_sdk_parachain_template:
      repository_url: https://github.com/paritytech/polkadot-sdk-parachain-template
      version: v0.0.5
      # Subdependencies are pinned to versions from the template's Cargo.lock.
      # Update these only when a new template version is released.
      subdependencies:
        polkadot_sdk_version: polkadot-stable2512-2
        polkadot_omni_node_version: 0.13.2
        staging_chain_spec_builder_version: 16.0.0
        frame_omni_bencher_version: 0.17.3
        rust_version: "1.88"
        rust_toolchain_macos: 1.88-aarch64-apple-darwin
        rust_toolchain_ubuntu: 1.88.0
  crates:
    cargo_pvm_contract:
      name: cargo-pvm-contract
      version: 0.3.0
    pallet_revive_uapi:
      name: pallet-revive-uapi
      version: 0.15.7
      ignore_updates: true
    polkavm:
      name: polkavm
      version: 0.35.0
      ignore_updates: true
    smoldot_light:
      name: smoldot-light
      version: 5.0.0
    subxt:
      name: subxt
      version: 0.50.1
    subxt_cli:
      name: subxt-cli
      version: 0.50.1
    subxt_signer:
      name: subxt-signer
      version: 0.50.1
    tokio:
      name: tokio
      version: 1.44.2
      ignore_updates: true
    polkadot_rest_api:
      name: polkadot-rest-api
      version: 0.3.3
    xcm_simulator:
      name: xcm-simulator
      # Matches the crate version shipped in polkadot_sdk.version; update it with the SDK.
      version: 32.0.0
      ignore_updates: true
    xcm_emulator:
      name: xcm-emulator
      # Matches the crate version shipped in polkadot_sdk.version; update it with the SDK.
      version: 0.38.0
      ignore_updates: true
    emulated_integration_tests_common:
      name: emulated-integration-tests-common
      # Matches the crate version shipped in polkadot_sdk.version; update it with the SDK.
      version: 43.0.0
      ignore_updates: true
    zombienet_sdk:
      name: zombienet-sdk
      version: 0.7.2
    polkadot_omni_node:
      name: polkadot-omni-node
      # Matches the crate version shipped in polkadot_sdk.version; update it with the SDK.
      version: 0.25.0
      ignore_updates: true
  javascript_packages:
    smoldot:
      name: smoldot
      version: 3.9.0
    substrate_connect:
      name: '@substrate/connect'
      version: 2.1.8
    substrate_connect_known_chains:
      name: '@substrate/connect-known-chains'
      version: 1.10.3
    dotns_cli:
      name: '@parity/dotns-cli'
      version: 2.0.0
    polkadot_api:
      name: polkadot-api
      version: 3.3.0
    resolc:
      name: '@parity/resolc'
      version: 1.5.0
    hardhat_polkadot:
      name: '@parity/hardhat-polkadot'
      version: 0.3.0
    hdkd:
      name: '@polkadot-labs/hdkd'
      version: 0.0.32
    hdkd_helpers:
      name: '@polkadot-labs/hdkd-helpers'
      version: 0.0.34
#   python_packages:

# Network values used in examples. Keep every RPC URL, chain ID and faucet here
# instead of inlining them in pages, and reference them as
# {{ networks.local.ws_url }}, {{ networks.polkadot_hub_testnet.eth_rpc_url }}, etc.
#
# Parity writes the software; these networks and endpoints are run by others.
# Examples should default to `local`. Use a live network only where a page is
# explicitly about connecting to one, and link to developers.polkadot.com for details.
networks:
  local:
    name: Local development node
    ws_url: ws://127.0.0.1:9944
    eth_rpc_url: http://127.0.0.1:8545
  polkadot_hub_testnet:
    name: Polkadot Hub TestNet
    currency: PAS
    chain_id: 420420417
    eth_rpc_url: https://eth-rpc-testnet.polkadot.io
    ws_url: wss://asset-hub-paseo.dotters.network
    explorer_url: https://blockscout-testnet.polkadot.io
    faucet_url: https://faucet.polkadot.io
  polkadot_hub:
    name: Polkadot Hub
    currency: DOT
    chain_id: 420420419
    eth_rpc_url: https://eth-rpc.polkadot.io
    ws_url: wss://polkadot-asset-hub-rpc.polkadot.io
    explorer_url: https://blockscout.polkadot.io
  kusama_hub:
    name: Kusama Hub
    currency: KSM
    chain_id: 420420418
    eth_rpc_url: https://eth-rpc-kusama.polkadot.io
    ws_url: wss://kusama-asset-hub-rpc.polkadot.io
    explorer_url: https://blockscout-kusama.polkadot.io
  polkadot:
    name: Polkadot relay chain
    ws_url: wss://rpc.polkadot.io
  kusama:
    name: Kusama relay chain
    ws_url: wss://kusama-rpc.polkadot.io
  paseo:
    name: Paseo relay chain
    ws_url: wss://paseo.dotters.network
